[project]
name = "render-markdown"
version = "0.1.0"
description = "Render Markdown for reading: in the browser, as a checked PDF, or on paper."
requires-python = ">=3.12"
dependencies = [
    "markdown>=3.7",
    "pypdfium2>=4.30",
]

[project.scripts]
render-markdown = "render_markdown.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["render_markdown"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100
src = [".", "tests"]
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["chrome: renders with a real Chrome (skipped without one unless RENDER_MARKDOWN_SMOKE=1)"]

[tool.coverage.run]
source = ["render_markdown"]
branch = true
omit = ["render_markdown/__main__.py"]  # tested through a subprocess (test_runs_as_a_module)

[tool.coverage.report]
fail_under = 95
show_missing = true
