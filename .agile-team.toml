[team]
docs_dir = "agile-team/docs"
artifacts = "committed"
key_file = ".team/run/api-key"
auth = "login"
cadence = "until-blocker"
budget_usd = 1500.0
manager_every_pct = 25

[toolchain]
preset = "python"
# Two runners share one toolchain (s37): agile-team/runner, then unattended/runner.
# `&&` keeps the coverage gate sound: both pyprojects set fail_under = 95, so a
# runner below it stops the chain and its TOTAL is the last one the gate reads.
# Each link has its own {report:<root>} (s125), so each writes its own report
# with ids made repo-relative and skips only the pending ids under its root.
test = "uv run --directory agile-team/runner pytest -n auto -q {report:agile-team/runner} && uv run --directory unattended/runner pytest -q {report:unattended/runner}"
coverage = "uv run --directory agile-team/runner pytest -n auto --cov --cov-report=term -q {report:agile-team/runner} && uv run --directory unattended/runner pytest --cov --cov-report=term -q {report:unattended/runner}"
lint = "uv run --directory agile-team/runner ruff check . && uv run --directory unattended/runner ruff check ."
# house-rules over the whole repo (s157 R4): gates, the quality step and both
# boundary checks run `static`, and its fail lines route to their owners.
static = "uv run --directory agile-team/runner ruff format --check . && uv run --directory unattended/runner ruff format --check . && uv run --frozen --quiet --project house-rules/runner house-rules check"
pragma = "# pragma: no cover"

# The stop hook's lint check (s126). Runs under sh from the repo root, so "$PWD"
# is the repo root before uv's --directory (s157, ADR-0081). `fix` throws away
# any hand edit to the house-rules baseline, then lets it only shrink (R6).
[toolchain.files]
fix = "uv run --directory {root} ruff check --fix --exit-zero --quiet {files} && uv run --directory {root} ruff format --quiet {files}; git restore --source=HEAD --staged --worktree -- .house-rules-baseline.json && uv run --frozen --quiet --project house-rules/runner house-rules baseline"
lint_files = 'uv run --directory {root} ruff check --quiet {files} && uv run --frozen --quiet --directory {root} --project "$PWD/house-rules/runner" house-rules check {files}'

[toolchain.globs]
source = [
    "agile-team/runner/agile_team/**",
    "agile-team/runner/scripts/**",
    "unattended/runner/unattended/**",
]
tests = [
    "agile-team/runner/tests/**",
    "!agile-team/runner/tests/e2e/**",
    "unattended/runner/tests/**",
]
e2e = [
    "agile-team/runner/tests/e2e/**",
]
ci = [
    ".github/workflows/**",
    "agile-team/runner/pyproject.toml",
    "agile-team/runner/uv.lock",
    "unattended/runner/pyproject.toml",
    "unattended/runner/uv.lock",
]

# Named-test runs (s69); the agile-team runner's suite runs in parallel (s70).
[[toolchain.targeted]]
root = "agile-team/runner"
command = "uv run --directory agile-team/runner pytest -q --no-header -n auto {tests}"

[[toolchain.targeted]]
root = "unattended/runner"
command = "uv run --directory unattended/runner pytest -q --no-header {tests}"

[gates]
coverage = 95
round_cap = 3
steps = [
    "design",
    "tests",
    "implement",
    "quality",
    "review",
    "design-review",
    "e2e",
    "acceptance",
]

[[environment]]
name = "cli"
kind = "package"
prepare = "uv venv {sandbox}/venv && uv pip install --python {sandbox}/venv {repo}/agile-team/runner"
bin = [
    "venv/bin",
]

[[environment]]
name = "unattended"
kind = "package"
prepare = "uv venv {sandbox}/venv-unattended && uv pip install --python {sandbox}/venv-unattended {repo}/unattended/runner"
bin = [
    "venv-unattended/bin",
]

[[environment]]
name = "dashboard"
kind = "web"
prepare = "uv run --directory {repo}/agile-team/runner agile-team --repo {sandbox}/presentation/workspace dashboard --host {host} --port {port} --no-open"
url = "http://127.0.0.1:8799/"
probe = "api/snapshot"

# For ACs with nothing to run (prompt, docs or design changes): the proxy reads
# the presentation's guide and the changed files and judges each AC (A14a AC5).
[[environment]]
name = "review"
kind = "document"

[roles.architect]
write = [
    "{docs}",
    "agile-team/SKILL.md",
    "agile-team/reference/**",
    "unattended/SKILL.md",
    "unattended/reference/**",
    "README.md",
    ".team/adr/**",
]

# s157: every role that changes Python may write the house-rules baseline.
# A [roles.<name>] write replaces the built-in list, so each restates it.
[roles.developer]
write = ["{source}", "!{tests}", "!{e2e}", ".house-rules-baseline.json"]

[roles.developer-cli]
write = ["{source}", "!{tests}", "!{e2e}", ".house-rules-baseline.json"]

[roles.developer-api]
write = ["{source}", "!{tests}", "!{e2e}", ".house-rules-baseline.json"]

[roles.developer-db]
write = ["{source}", "!{tests}", "!{e2e}", ".house-rules-baseline.json"]

[roles.developer-gui]
write = ["{source}", "!{tests}", "!{e2e}", ".house-rules-baseline.json"]

[roles.unit-tester]
write = ["{tests}", ".house-rules-baseline.json"]

[roles.integration-tester]
write = ["{e2e}", ".team/run/presentation/**", ".house-rules-baseline.json"]

[roles.devops]
write = ["{ci}", "{config}", ".team/baseline.json", ".house-rules-baseline.json", ".house-rules.toml"]
