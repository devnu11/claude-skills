[team]
docs_dir = "agile-team/docs"
artifacts = "committed"
key_file = ".team/run/api-key"
auth = "login"
cadence = "until-blocker"
budget_usd = 1500.0
manager_every_pct = 25

[toolchain]
preset = "python"
# Two runners share one toolchain (s37): agile-team/runner, then unattended/runner.
# `&&` keeps the coverage gate sound: both pyprojects set fail_under = 95, so a
# runner below it stops the chain and its TOTAL is the last one the gate reads.
# Each link has its own {report:<root>} (s125), so each writes its own report
# with ids made repo-relative and skips only the pending ids under its root.
test = "uv run --directory agile-team/runner pytest -n auto -q {report:agile-team/runner} && uv run --directory unattended/runner pytest -q {report:unattended/runner}"
coverage = "uv run --directory agile-team/runner pytest -n auto --cov --cov-report=term -q {report:agile-team/runner} && uv run --directory unattended/runner pytest --cov --cov-report=term -q {report:unattended/runner}"
lint = "uv run --directory agile-team/runner ruff check . && uv run --directory unattended/runner ruff check ."
static = "uv run --directory agile-team/runner ruff format --check . && uv run --directory unattended/runner ruff format --check ."
pragma = "# pragma: no cover"

[toolchain.globs]
source = [
    "agile-team/runner/agile_team/**",
    "agile-team/runner/scripts/**",
    "unattended/runner/unattended/**",
]
tests = [
    "agile-team/runner/tests/**",
    "!agile-team/runner/tests/e2e/**",
    "unattended/runner/tests/**",
]
e2e = [
    "agile-team/runner/tests/e2e/**",
]
ci = [
    ".github/workflows/**",
    "agile-team/runner/pyproject.toml",
    "agile-team/runner/uv.lock",
    "unattended/runner/pyproject.toml",
    "unattended/runner/uv.lock",
]

# Named-test runs (s69); the agile-team runner's suite runs in parallel (s70).
[[toolchain.targeted]]
root = "agile-team/runner"
command = "uv run --directory agile-team/runner pytest -q --no-header -n auto {tests}"

[[toolchain.targeted]]
root = "unattended/runner"
command = "uv run --directory unattended/runner pytest -q --no-header {tests}"

[gates]
coverage = 95
round_cap = 3
steps = [
    "design",
    "tests",
    "implement",
    "quality",
    "review",
    "design-review",
    "e2e",
    "acceptance",
]

[[environment]]
name = "cli"
kind = "package"
prepare = "uv venv {sandbox}/venv && uv pip install --python {sandbox}/venv {repo}/agile-team/runner"
bin = [
    "venv/bin",
]

[[environment]]
name = "unattended"
kind = "package"
prepare = "uv venv {sandbox}/venv-unattended && uv pip install --python {sandbox}/venv-unattended {repo}/unattended/runner"
bin = [
    "venv-unattended/bin",
]

[[environment]]
name = "dashboard"
kind = "web"
prepare = "uv run --directory {repo}/agile-team/runner agile-team --repo {sandbox}/presentation/workspace dashboard --host {host} --port {port} --no-open"
url = "http://127.0.0.1:8799/"
probe = "api/snapshot"

[roles.architect]
write = [
    "{docs}",
    "agile-team/SKILL.md",
    "agile-team/reference/**",
    "unattended/SKILL.md",
    "unattended/reference/**",
    "README.md",
    ".team/adr/**",
]
