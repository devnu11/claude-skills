[team]
docs_dir = "agile-team/docs"
artifacts = "committed"
key_file = ".team/run/api-key"
auth = "login"
cadence = "until-blocker"
budget_usd = 40.0
manager_every_pct = 25

[toolchain]
preset = "python"
test = "uv run --directory agile-team/runner pytest -q"
coverage = "uv run --directory agile-team/runner pytest --cov --cov-report=term -q"
lint = "uv run --directory agile-team/runner ruff check ."
static = "uv run --directory agile-team/runner ruff format --check ."
pragma = "# pragma: no cover"

[toolchain.globs]
source = [
    "agile-team/runner/agile_team/**",
    "agile-team/runner/scripts/**",
]
tests = [
    "agile-team/runner/tests/**",
    "!agile-team/runner/tests/e2e/**",
]
e2e = [
    "agile-team/runner/tests/e2e/**",
]
ci = [
    ".github/workflows/**",
    "agile-team/runner/pyproject.toml",
    "agile-team/runner/uv.lock",
]

[gates]
coverage = 95
round_cap = 3
steps = [
    "design",
    "tests",
    "implement",
    "quality",
    "review",
    "design-review",
    "e2e",
    "acceptance",
]

[[delivery]]
name = "cli"
kind = "package"
prepare = "uv venv {sandbox}/venv && uv pip install --python {sandbox}/venv {repo}/agile-team/runner"
bin = [
    "venv/bin",
]

[[delivery]]
name = "dashboard"
kind = "web"
prepare = "uv run --directory {repo}/agile-team/runner agile-team --repo {repo} dashboard --host 127.0.0.1 --port 8799 --no-open"
url = "http://127.0.0.1:8799/"

[roles.architect]
write = [
    "{docs}",
    "agile-team/SKILL.md",
    "agile-team/reference/**",
    "README.md",
]
