<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow chart mock</title>
<style>
  :root { --bg:#fbfaf7; --card:#fff; --ink:#1d1d1b; --ink-2:#5b5a55; --line:#dedbd2; --accent:#c2410c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#191917; --card:#22221f; --ink:#ecebe6; --ink-2:#a9a79f; --line:#3a3934; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui, sans-serif; }
  main { max-width:1440px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.sub { color:var(--ink-2); margin:0 0 16px; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .tabs button { font:inherit; padding:6px 12px; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:6px; cursor:pointer; }
  .tabs button[aria-selected=true] { border-color:var(--accent); box-shadow:inset 0 -2px 0 var(--accent); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:16px; }
  .note { color:var(--ink-2); margin:0 0 8px; }
  .bar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin:8px 0; color:var(--ink-2); }
  .view { overflow:auto; border:1px dashed var(--line); border-radius:6px; padding:8px; min-height:200px; }
  .view.fit svg { max-width:100% !important; height:auto; }
  .view:not(.fit) svg { max-width:none !important; }
  textarea { width:100%; box-sizing:border-box; min-height:260px; font:13px/1.4 ui-monospace, monospace; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:8px; }
  .err { color:#b91c1c; white-space:pre-wrap; }

  .g-flow { display:flex; flex-direction:column; align-items:center; gap:0; font-size:12px; }
  .g-band { border:1px solid var(--line); border-radius:8px; padding:6px 10px 10px; background:color-mix(in srgb, var(--card) 85%, var(--ink) 15%); max-width:100%; }
  .g-band.dashed { border-style:dashed; opacity:.75; }
  .g-band h4 { margin:0 0 6px; font-size:12px; text-align:center; color:var(--ink-2); font-weight:600; }
  .g-row { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .g-card { border:1px solid var(--line); border-radius:6px; background:var(--card); padding:6px 10px; text-align:center; line-height:1.5; min-width:170px; }
  .g-card b { display:block; }
  .g-card.active { border:2px solid var(--accent); box-shadow:0 0 10px color-mix(in srgb, var(--accent) 60%, transparent); }
  .g-card.idle { opacity:.6; }
  .g-tools { color:var(--ink-2); font-style:italic; }
  .g-tools.top { border-bottom:1px dashed var(--line); padding-bottom:3px; margin-bottom:3px; }
  .g-tools.bottom { border-top:1px dashed var(--line); padding-top:3px; margin-top:3px; }
  .g-arrow { position:relative; width:2px; height:26px; background:var(--ink-2); margin:2px 0 8px; }
  .g-arrow::after { content:""; position:absolute; left:-4px; bottom:-6px; border:5px solid transparent; border-top-color:var(--ink-2); }
  .g-arrow.live::before { content:""; position:absolute; left:-4px; width:10px; height:10px; border-radius:50%; background:var(--accent); animation:g-move 1.4s linear infinite; }
  @keyframes g-move { from { top:-4px; } to { top:22px; } }
  .g-pill { border:1px solid var(--line); border-radius:999px; padding:3px 12px; background:var(--card); }

  .h { --m:#4f7cc8; --t:#d08a2c; --bad:#c2410c; font-size:10px; line-height:1.4; display:flex; flex-direction:column; align-items:center; gap:0; }
  .h-lead { display:flex; gap:6px; align-items:flex-start; border:1px solid var(--line); border-radius:8px; padding:4px 8px 8px; background:color-mix(in srgb, var(--card) 85%, var(--ink) 15%); }
  .h-lead > .h-title { writing-mode:vertical-rl; transform:rotate(180deg); color:var(--ink-2); font-weight:600; align-self:center; }
  .h-unit { display:flex; flex-direction:column; gap:2px; width:180px; }
  .h-box { border:1px solid var(--line); border-radius:6px; background:var(--card); padding:5px 7px; text-align:center; }
  .h-box b { display:block; font-size:12px; }
  .h-box .h-meta { color:var(--ink-2); }
  .h-box.active { border:2px solid var(--accent); box-shadow:0 0 8px color-mix(in srgb, var(--accent) 55%, transparent); }
  .h-box.idle { opacity:.55; }
  .h-tool { border:1px dashed var(--line); border-radius:4px; padding:2px 6px; color:var(--ink-2); font-style:italic; text-align:center; }
  .h-share { display:flex; height:5px; border-radius:3px; overflow:hidden; margin:4px 0 2px; background:var(--line); gap:1px; }
  .h-share .m { background:var(--m); } .h-share .t { background:var(--t); }
  .h-share-l { display:flex; justify-content:space-between; color:var(--ink-2); }
  .h-share-l i { font-style:normal; } .h-share-l i::before { content:""; display:inline-block; width:6px; height:6px; border-radius:2px; margin-right:3px; vertical-align:middle; }
  .h-share-l .lm::before { background:var(--m); } .h-share-l .lt::before { background:var(--t); }
  .h-drop { position:relative; height:34px; width:100%; }
  .h-bus { position:absolute; top:16px; height:2px; background:var(--ink-2); opacity:.5; }
  .h-stem { position:absolute; width:2px; background:var(--ink-2); opacity:.5; }
  .h-grid { display:grid; column-gap:0; row-gap:0; align-items:start; }
  .h-col-title { text-align:center; color:var(--ink-2); font-weight:600; padding-bottom:3px; }
  .h-cell { padding:0 0 2px; display:flex; justify-content:center; } .h-cell > * { width:100%; box-sizing:border-box; }
  .h-gap-row { height:8px; }
  .h-arrow { position:relative; width:22px; height:2px; background:var(--ink-2); align-self:center; justify-self:center; }
  .h-arrow::after { content:""; position:absolute; right:-6px; top:-4px; border:5px solid transparent; border-left-color:var(--ink-2); }
  .h-arrow.live::before { content:""; position:absolute; top:-4px; width:10px; height:10px; border-radius:50%; background:var(--accent); animation:h-right 1.3s linear infinite; }
  @keyframes h-right { from { left:-4px; } to { left:22px; } }
  .h-dot-down { position:absolute; width:10px; height:10px; border-radius:50%; background:var(--bad); animation:h-down 1.6s linear infinite; }
  @keyframes h-down { from { top:-2px; } to { top:30px; } }
  .h-legend { display:flex; gap:14px; color:var(--ink-2); margin-top:10px; flex-wrap:wrap; justify-content:center; }

  .h-arrow.back::before { content:""; position:absolute; top:-4px; width:10px; height:10px; border-radius:50%; background:var(--bad); animation:h-left 1.3s linear infinite; }
  @keyframes h-left { from { left:22px; } to { left:-4px; } }
  .h-gap { height:14px; }
  .h-top { display:flex; align-items:center; gap:0; }
  .h-arrow.both::before { content:""; position:absolute; left:-6px; top:-4px; border:5px solid transparent; border-right-color:var(--ink-2); }
  .h-lead-grid { display:grid; grid-auto-flow:column; grid-template-rows:auto auto auto; column-gap:6px; row-gap:2px; align-items:end; }
  .h-lead-grid > .h-box-row { align-self:start; }
  .h-lead-grid > .h-below { align-self:start; }

  .j-group { align-self:stretch; border:1px solid var(--line); border-radius:8px; background:color-mix(in srgb, var(--card) 85%, var(--ink) 15%); z-index:0; }
  .j-group.running { border-color:var(--accent); }
  .j-grid > :not(.j-group) { z-index:1; position:relative; }
  .j-grid .h-cell { padding:0 8px 2px; }
  .j-grid .h-col-title { padding-top:4px; }
  .h-tool.now { border-style:solid; border-color:var(--accent); color:var(--ink); font-style:normal;
    background:repeating-linear-gradient(-45deg, transparent 0 6px, color-mix(in srgb, var(--accent) 18%, transparent) 6px 12px);
    background-size:200% 100%; animation:j-stripe 2s linear infinite; }
  @keyframes j-stripe { from { background-position:0 0; } to { background-position:-34px 0; } }
  .h-live { margin-top:4px; padding-top:3px; border-top:1px solid var(--line); text-align:left; color:var(--ink); }
  .h-live .pulse { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--accent); margin-right:4px; animation:blink 1.2s infinite; vertical-align:middle; }
  @keyframes blink { 50% { opacity:.25; } }

  .k { width:100%; }
  .k .h-top { justify-content:center; }
  .k-grid { display:grid; width:100%; align-items:start; }
  .k-grid > :not(.k-group) { z-index:1; position:relative; }
  .k-group { align-self:stretch; border:1px solid var(--line); border-radius:8px; background:color-mix(in srgb, var(--card) 85%, var(--ink) 15%); }
  .k-grid .h-cell { padding:0 10px 2px; }
  .k-grid .h-col-title { padding-top:4px; font-size:11px; }
  .k { --run1:#2e9d5b; --run2:#3b7ddd; --run3:#e0901f; --fail:#d23c3c; --warn:#c9b22c; }
  .h-box.run1 { border:2px solid var(--run1); box-shadow:0 0 9px color-mix(in srgb, var(--run1) 60%, transparent); }
  .h-box.run2 { border:2px solid var(--run2); box-shadow:0 0 9px color-mix(in srgb, var(--run2) 60%, transparent); }
  .h-box.run3 { border:2px solid var(--run3); box-shadow:0 0 9px color-mix(in srgb, var(--run3) 60%, transparent); }
  .k-group.run1 { border-color:var(--run1); } .k-group.run2 { border-color:var(--run2); } .k-group.run3 { border-color:var(--run3); }
  .h-live.run1 .pulse { background:var(--run1); } .h-live.run2 .pulse { background:var(--run2); } .h-live.run3 .pulse { background:var(--run3); }
  .h-tool.k-now { border-style:solid; border-color:var(--accent); color:var(--ink); font-style:normal;
    background:repeating-linear-gradient(45deg, transparent 0 6px, color-mix(in srgb, var(--accent) 22%, transparent) 6px 12px);
    animation:k-stripe 1.5s linear infinite; }
  @keyframes k-stripe { from { background-position:0 0; } to { background-position:17px 0; } }
  .k-arrow { position:relative; width:30px; height:2px; background:var(--ink-2); align-self:center; justify-self:center; }
  .k-arrow::before { content:""; position:absolute; right:-6px; top:-4px; border:5px solid transparent; border-left-color:var(--ink-2); z-index:0; }
  .k-arrow.live::after { content:""; position:absolute; top:-4px; width:10px; height:10px; border-radius:50%; background:var(--accent); z-index:2; animation:h-right 1.3s linear infinite; }
  .k-drops { height:46px; }
  .k-svg { position:absolute; inset:0; pointer-events:none; overflow:visible; z-index:3; }
  .k-svg path.drop { fill:none; stroke:var(--ink-2); stroke-width:1.5; opacity:.7; }
  .k-svg .head { fill:var(--ink-2); opacity:.9; }
  .k-svg circle { fill:#d23c3c; }
  .k-picker { display:flex; gap:6px; justify-content:center; margin-bottom:8px; color:var(--ink-2); }
  .k-picker button { font:inherit; font-size:11px; padding:2px 8px; border:1px solid var(--line); border-radius:4px; background:var(--card); color:var(--ink); cursor:pointer; }

  .l { --run2:#8b5cf6; }
  .l .h-col-title, .l .h-lead > .h-title { font-size:12px; }
  .l-cols { display:flex; justify-content:center; align-items:stretch; }
  .l-group { width:236px; box-sizing:border-box; border:1px solid var(--line); border-radius:8px; padding:4px 10px 10px;
    background:color-mix(in srgb, var(--card) 85%, var(--ink) 15%); display:flex; flex-direction:column; gap:14px; }
  .l-group.run1 { border-color:var(--run1); } .l-group.run2 { border-color:var(--run2); } .l-group.run3 { border-color:var(--run3); }
  .l-unit { display:flex; flex-direction:column; gap:2px; }
  .l-gap { width:48px; display:flex; align-items:flex-start; justify-content:center; }
  .l-gap .k-arrow { align-self:flex-start; margin-top:var(--arrow-y, 60px); }
  .l-grid { display:grid; align-items:start; justify-content:center; }
  .l-grid > .l-bg { align-self:stretch; border:1px solid var(--line); border-radius:8px; background:color-mix(in srgb, var(--card) 85%, var(--ink) 15%); }
  .l-grid > .l-bg.run1 { border-color:var(--run1); } .l-grid > .l-bg.run2 { border-color:var(--run2); } .l-grid > .l-bg.run3 { border-color:var(--run3); }
  .l-grid > :not(.l-bg) { position:relative; z-index:1; }
  .l-grid .h-cell { padding:0 10px 2px; }

  .m .l-gap { width:96px; }
  .m .k-arrow { width:72px; }
  .m .l-group { gap:26px; }
  .m .l-unit + .l-unit { border-top:1px dashed color-mix(in srgb, var(--line) 70%, transparent); padding-top:24px; margin-top:-2px; }
  .m-rate { display:flex; align-items:center; justify-content:space-between; gap:6px; margin-top:3px; }
  .m-rate b { font-size:11px; display:inline; }
  .m-spark { width:96px; height:22px; }
  .m-spark path.line { fill:none; stroke-width:1.5; }
  .m-spark path.area { opacity:.18; }

  /* ---- variant N ---- */
  .n { --role-gap:20px; --group-w:236px; }
  .n-cols { display:flex; width:100%; align-items:stretch; }
  .n-group { flex:0 0 var(--group-w); box-sizing:border-box; border:1px solid var(--line); border-radius:8px; padding:4px 10px 10px;
    background:color-mix(in srgb, var(--card) 85%, var(--ink) 15%); display:flex; flex-direction:column; }
  .n-group.run1 { border-color:var(--run1); } .n-group.run2 { border-color:var(--run2); } .n-group.run3 { border-color:var(--run3); }
  .n-group .h-col-title { font-size:12px; padding-bottom:6px; }
  .n-unit { display:flex; flex-direction:column; gap:2px; }
  .n-unit + .n-unit { border-top:1px solid color-mix(in srgb, var(--ink) 28%, transparent); margin-top:var(--role-gap); padding-top:var(--role-gap); }
  .n-gap { flex:1 1 40px; min-width:40px; display:flex; align-items:flex-start; padding:0 8px; }
  .n-gap .k-arrow { width:100%; align-self:flex-start; margin-top:var(--arrow-y, 60px); }
  .n-meta span + span::before { content:" · "; }
  .n-share-none { height:5px; border-radius:3px; margin:4px 0 2px; background:repeating-linear-gradient(90deg, var(--line) 0 4px, transparent 4px 7px); }
  .n-share-none + .h-share-l { justify-content:center; }
  .n-spark { display:flex; align-items:center; justify-content:space-between; gap:6px; margin-top:3px; color:var(--ink-2); }
  .n-spark b { color:var(--ink); font-size:11px; display:inline; }
  .n-spark svg { width:96px; height:20px; }
  .n-tool-run { border:1px solid var(--accent); border-radius:4px; padding:3px 6px; color:var(--ink); }
  .n-tool-run.fail { border-color:var(--run3); }
  .n-prog { height:6px; border-radius:3px; background:var(--line); overflow:hidden; margin:3px 0; }
  .n-prog span { display:block; height:100%; background:var(--accent); }
  .n-tool-run.fail .n-prog span { background:var(--run3); }
  .n-tool-run .row { display:flex; justify-content:space-between; align-items:center; gap:6px; }
  .n-tool-run svg { width:80px; height:18px; }
  .n-gear { position:relative; display:flex; justify-content:flex-end; width:100%; margin-bottom:6px; gap:6px; }
  .n-gear > button { font:inherit; font-size:11px; padding:2px 8px; border:1px solid var(--line); border-radius:4px; background:var(--card); color:var(--ink); cursor:pointer; }
  .n-settings { position:absolute; right:0; top:26px; z-index:5; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:11px; width:260px; box-shadow:0 6px 18px rgba(0,0,0,.35); }
  .n-settings h5 { margin:0 0 6px; font-size:11px; color:var(--ink-2); font-weight:600; }
  .n-settings label { display:block; margin:3px 0; }
  .n-settings .fixed { color:var(--ink-2); margin-bottom:8px; }
  .n.hide-tokens .f-tokens, .n.hide-cost .f-cost, .n.hide-time .f-time, .n.hide-bounces .f-bounces,
  .n.hide-share .f-share, .n.hide-spark .f-spark, .n.hide-tools .f-tools, .n.hide-toolstats .f-toolstats,
  .n.hide-legend .h-legend { display:none !important; }

  .n .h-tool { padding:0; }
  .n-tool-run.it1 { border-color:var(--run1); } .n-tool-run.it2 { border-color:var(--run2); } .n-tool-run.it3 { border-color:var(--run3); }
  .n-pass { display:flex; height:6px; border-radius:3px; overflow:hidden; background:var(--line); margin:3px 0 1px; gap:1px; }
  .n-pass .ok { background:var(--run1); } .n-pass .bad { background:var(--fail); } .n-pass .warn { background:var(--warn); }
  .n-tool-run .cap { display:flex; justify-content:space-between; color:var(--ink-2); }
  .n-tool-run .cap .ok::before, .n-tool-run .cap .bad::before { content:""; display:inline-block; width:6px; height:6px; border-radius:2px; margin-right:3px; vertical-align:middle; }
  .n-tool-run .cap .ok::before { background:var(--run1); } .n-tool-run .cap .bad::before { background:var(--fail); } .n-tool-run .cap .warn::before { content:""; display:inline-block; width:6px; height:6px; border-radius:2px; margin-right:3px; vertical-align:middle; background:var(--warn); }
  .n-tool-run .cap { justify-content:flex-start; gap:4px; flex-wrap:wrap; }

  .n-tool-run .cap { flex-wrap:nowrap; gap:3px; white-space:nowrap; }
  .n-tool-run .cap span::before { display:none !important; }
  .n-tool-run .cap .ok b { color:var(--run1); } .n-tool-run .cap .warn b { color:var(--warn); } .n-tool-run .cap .bad b { color:var(--fail); }
  .n-tool-run .cap b { display:inline; font-size:10px; }

  .n .k-arrow.live::after { animation:n-right 1.6s linear infinite; }
  @keyframes n-right { from { left:-4px; } to { left:calc(100% - 4px); } }
  details summary { cursor:pointer; color:var(--ink-2); }
</style>
</head>
<body>
<main>
  <h1>Flow chart mock</h1>
  <p class="sub">This run's real roles and counts (briefs, handoffs, step hours). Mermaid 11.4.1, the dashboard's version. Edit any source and press Render. "Fit to width" shows what the dashboard does today.</p>
  <div class="tabs" id="tabs"></div>
  <div id="panes"></div>
</main>

<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";
import elkLayouts from "https://cdn.jsdelivr.net/npm/@mermaid-js/layout-elk@0.1.7/dist/mermaid-layout-elk.esm.min.mjs";
mermaid.registerLayoutLoaders(elkLayouts);

const CLASSES = `
classDef active stroke:#c2410c,stroke-width:3px
classDef idle fill:#efeee9,stroke:#cfcdc4,color:#5b5a55
classDef stage fill:#f3f1ea,stroke:#9b998f,stroke-dasharray:3 3,color:#3a3934`;

const ROLE = {
  you: `you(["You (via liaison)"])`,
  po: `po["<b>Product Owner</b><br/>opus · 54 turns"]`,
  mgr: `mgr["<b>manager</b><br/>opus · 0.7h<br/>139 briefs · 138 back"]`,
  cp: `cp["<b>customer-proxy</b><br/>sonnet · 1.0h<br/>103 briefs · 101 back"]`,
  arch: `arch["<b>architect</b><br/>opus · 11.6h<br/>165 briefs · 162 back"]`,
  ut: `ut["<b>unit-tester</b><br/>sonnet · 5.7h<br/>243 briefs · 241 back"]`,
  dcli: `dcli["<b>developer-cli</b><br/>sonnet · 8.2h<br/>199 briefs · 194 back<br/>⏱ running 4m"]`,
  dgui: `dgui["<b>developer-gui</b><br/>sonnet · 1.0h<br/>65 briefs · 65 back"]`,
  dapi: `dapi["<b>developer-api</b><br/>sonnet · 1.0h<br/>14 briefs · 14 back"]`,
  dev: `dev["<b>developer</b><br/>sonnet · 0.4h<br/>13 briefs · 13 back"]`,
  qc: `qc["<b>quality-czar</b><br/>sonnet · 5.0h<br/>136 briefs · 136 back"]`,
  cr: `cr["<b>code-reviewer</b><br/>opus · 3.5h<br/>109 briefs · 109 back"]`,
  it: `it["<b>integration-tester</b><br/>sonnet · 5.7h<br/>158 briefs · 156 back"]`,
  scr: `scr["<b>scribe</b><br/>haiku · 2.8h<br/>69 briefs · 69 back"]`,
  ops: `ops["<b>devops</b><br/>sonnet · 0.7h<br/>14 briefs · 14 back"]`,
  stEnv: `stEnv{{"Prepare env<br/>runner · 103 runs"}}`,
  stGate: `stGate{{"Implement gate<br/>runner · 291 runs"}}`,
  stE2e: `stE2e{{"E2E gate<br/>runner · 156 runs"}}`,
  stBnd: `stBnd{{"Boundary<br/>runner · 37 runs"}}`,
};
const R = (...ids) => ids.map((id) => "    " + ROLE[id]).join("\n");


// ----- variant D: the human's notes (16:55) -----
const BOX = {
  po: ["Product Owner", "sonnet · 97M · $1,086 · 54 turns", "model 66% ███████░░░ tools 34%"],
  mgr: ["manager", "sonnet · 10M · $12 · 0.7h", "↩ 1 bounced", "model 99% ██████████ tools 1%"],
  cp: ["customer-proxy", "sonnet · 28M · $17 · 1.0h", "↩ 30 bounced", "model 67% ███████░░░ tools 33%"],

/** One decimal: seconds under a minute, minutes under an hour, then hours. */
function fmtMin(min) {

function seeded(name, n = 14) {

mermaid.initialize({
  startOnLoad: false, securityLevel: "strict", theme: matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "default",
  flowchart: { useMaxWidth: false, htmlLabels: true }, themeVariables: { fontSize: "12px" },
});

let seq = 0;
async function draw(pane) {
  const view = pane.querySelector(".view"), err = pane.querySelector(".err");
  err.textContent = "";
  if (pane.dataset.html) { view.innerHTML = pane.querySelector("textarea").value; AFTER[pane.dataset.id]?.(view); return; }
  try {
    const { svg } = await mermaid.render("m" + seq++, pane.querySelector("textarea").value);
    view.innerHTML = svg;
    const box = view.querySelector("svg").getBoundingClientRect();
    pane.querySelector(".size").textContent = `drawn at ${Math.round(box.width)} × ${Math.round(box.height)} px`;
  } catch (e) { err.textContent = String(e.message || e); }
}

const AFTER = {};
function build() {
  const tabs = document.getElementById("tabs"), panes = document.getElementById("panes");
  for (const v of VARIANTS) {
    const b = document.createElement("button");
    b.textContent = v.label; b.dataset.id = v.id; tabs.append(b);
    const pane = document.createElement("section");
    pane.className = "card"; pane.dataset.id = v.id; pane.hidden = true; if (v.html) pane.dataset.html = "1"; if (v.after) AFTER[v.id] = v.after;
    pane.innerHTML = `<p class="note"></p>
      <div class="bar"><label><input type="checkbox" class="fit"> Fit to width (today's behaviour)</label><span class="size"></span></div>
      <div class="view"></div><p class="err"></p>
      <details open><summary>Mermaid source (editable)</summary><textarea spellcheck="false"></textarea>
      <div class="bar"><button class="go">Render</button><button class="reset">Reset</button></div></details>`;
    pane.querySelector(".note").textContent = v.note;
    pane.querySelector("textarea").value = v.src;
    pane.querySelector(".go").onclick = () => draw(pane);
    pane.querySelector(".reset").onclick = () => { pane.querySelector("textarea").value = v.src; draw(pane); };
    pane.querySelector(".fit").onchange = (e) => pane.querySelector(".view").classList.toggle("fit", e.target.checked);
    panes.append(pane);
    b.onclick = () => select(v.id);
  }
}

function select(id) {
  for (const b of document.querySelectorAll("#tabs button")) b.setAttribute("aria-selected", b.dataset.id === id);
  for (const p of document.querySelectorAll("#panes section")) {
    p.hidden = p.dataset.id !== id;
    if (!p.hidden && !p.querySelector(".view").innerHTML) draw(p);
  }
}

function main() { addEventListener("resize", () => document.querySelectorAll("#panes section").forEach((p) => !p.hidden && AFTER[p.dataset.id]?.(p.querySelector(".view")))); build(); select(location.hash.slice(1) || "n"); }
main();
</script>
