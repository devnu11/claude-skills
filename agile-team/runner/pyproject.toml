[project]
name = "agile-team"
version = "0.1.0"
description = "Headless runner that drives a team of specialized Claude roles through a story pipeline."
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.163",
    "pyyaml>=6",
    "tomli-w>=1.0",
]

[project.scripts]
agile-team = "agile_team.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agile_team"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100
src = ["agile_team", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["agile_team"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
