[project]
name = "unattended"
version = "0.1.0"
description = "Run a prompt or command unattended: resume after usage limits, within a deadline, resume and cost limits."
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.163",
]

[project.scripts]
unattended = "unattended.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["unattended"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100
src = ["unattended", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["unattended"]
branch = true
omit = ["unattended/__main__.py"]  # runs only in the detached supervisor

[tool.coverage.report]
fail_under = 95
show_missing = true
