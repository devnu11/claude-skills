[project]
name = "group-chat"
version = "0.1.0"
description = "A shared-thread group chat between a human and several Claude roles, routed by @mention."
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.163",
]

[project.scripts]
group-chat = "group_chat.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["group_chat"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100
src = ["group_chat", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "unit: one module in isolation, no files beyond tmp_path",
    "integration: several modules and real files together, only the model faked",
    "acceptance: user-facing behaviour from SKILL.md and protocol.md, through the CLI",
]

[tool.coverage.run]
source = ["group_chat"]
branch = true
omit = ["group_chat/__main__.py"]

[tool.coverage.report]
fail_under = 95
show_missing = true
