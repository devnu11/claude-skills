name: unattended runner

on:
  push:
    branches: [main, "team/**"]
    paths: ["unattended/**", ".github/workflows/unattended.yml", ".team/pending-tests.json"]
  pull_request:
    paths: ["unattended/**", ".github/workflows/unattended.yml", ".team/pending-tests.json"]

defaults:
  run:
    working-directory: unattended/runner

jobs:
  test:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'team/') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --dev
        env:
          UV_PYTHON: ${{ matrix.python-version }}
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      # Skip the tests that are pending in .team/pending-tests.json (s125):
      # written red by the tests step, they go green with their story.
      - run: |
          skips="$(uv run --locked --directory ../../agile-team/runner agile-team --repo ../.. pending-tests --root unattended/runner)"
          PYTEST_ADDOPTS="$skips" uv run --locked pytest --cov

  # The Windows paths (the liveness probe, the process group) on a real Windows.
  windows-probe:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'team/') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run pytest tests/test_store.py tests/test_process_group.py -k "kernel32 or windows"
