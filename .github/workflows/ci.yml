name: CI

on:
  push:
    branches: [main, "team/**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'team/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -s sh install.sh tests/*.sh

  test:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'team/') }}
    # ubuntu's sh is dash, macOS's is bash in POSIX mode: two different shells.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install.sh tests
        run: sh tests/install_test.sh
