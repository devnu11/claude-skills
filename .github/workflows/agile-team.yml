name: agile-team runner

on:
  push:
    branches: [main, "team/**"]
    paths: ["agile-team/**", ".github/workflows/agile-team.yml", "unattended/SKILL.md", "unattended/reference/**", "README.md", ".github/workflows/unattended.yml"]
  pull_request:
    paths: ["agile-team/**", ".github/workflows/agile-team.yml", "unattended/SKILL.md", "unattended/reference/**", "README.md", ".github/workflows/unattended.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: agile-team/runner

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --dev
        env:
          UV_PYTHON: ${{ matrix.python-version }}
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      # No pending-test skips (s159): a story's red tests live only on its branch.
      - run: uv run --locked pytest -n auto --cov
