[project]
name = "house-rules"
version = "0.1.0"
description = "Check the human's code rules as code: global scope, function size, parameters, booleans and names."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
house-rules = "house_rules.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["house_rules"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100
src = ["house_rules", "tests"]
extend-exclude = ["tests/samples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Word lists read best as whitespace-separated text.
"house_rules/verbs.py" = ["SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["house_rules"]
branch = true
omit = ["house_rules/__main__.py"]  # tested through a subprocess (test_runs_as_a_module)

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.house-rules]
exclude = ["tests/samples/**"]
