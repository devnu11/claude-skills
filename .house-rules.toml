# house-rules settings for this repo. The defaults are the global code rules;
# see house-rules/reference/rules.md.

# The team checkout holds untracked runner copies; scan only the real tree (s157).
exclude = [
    "**/.venv/**", "**/build/**", "**/dist/**", "**/node_modules/**",
    ".team/run/**", ".claude/worktrees/**",
]

# Real verbs house-rules' table lacks (s161).
verbs = ["arrange", "give", "lift", "pair", "place", "prune", "reserve"]
# `pair` is a noun too: `loops.Setback.pair` is the property "the two steps
# a setback moved between", which the `pair` verb above would refuse (s161).
allow_names = ["pair"]

# Real verbs house-rules' table lacks (s161).
verbs = ["arrange", "give", "lift", "pair", "place", "prune", "reserve"]
